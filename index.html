<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('graphtotex-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--seo-head-start-->
    <meta name="description" content="A free Desmos-style graphing calculator with TikZ export. Plot functions and implicit equations, preview your LaTeX figure, and download .tex code." />
    <title>GraphToTeX | Desmos-style Graphing with TikZ Export</title>
    <!--seo-head-end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
