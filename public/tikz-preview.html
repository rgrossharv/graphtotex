<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>GraphToTeX figure preview</title>
    <style>
      :root { color-scheme: light; background: #fff; color: #000; }
      * { box-sizing: border-box; }
      html, body, #figure { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { padding: 20px; }
      #figure, #figure > .tikzjax-wrapper { display: flex; align-items: center; justify-content: center; }
      #figure > .tikzjax-wrapper { margin: 0; width: 100%; height: 100%; overflow: visible; }
      #figure > .tikzjax-wrapper svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
      #figure .tikzjax-loading, #figure .tikzjax-broken-wrapper { visibility: hidden; }
    </style>
    <script src="/tikz-preview.js" defer></script>
  </head>
  <body><div id="figure" aria-label="Typeset figure"></div></body>
</html>
